databaseChangeLog:
  - changeSet:
      id: 1
      author: student
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: varchar(255)

  - changeSet:
      id: 2
      author: student
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: varchar(255)
              - column:
                  name: author_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ads_users
                    references: users(id)

  - changeSet:
      id: 3
      author: student
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_users
                    references: users(id)
              - column:
                  name: ad_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ads
                    references: ads(id)
  - changeSet:
      id: 4
      author: student
      changes:
        - modifyDataType:
            tableName: users
            columnName: password
            newDataType: varchar(100)